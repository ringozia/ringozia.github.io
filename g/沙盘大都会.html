            const grassTarget = Math.round(interior.length * 0.35);
            const grassSeeds = Math.max(1, Math.min(3, Math.floor(grassTarget / 6)));
            const grassCells = [];
            for (let s = 0; s < grassSeeds && grassCells.length < grassTarget; s++) {
                const free = interior.filter(k => !used.has(k));
                if (!free.length) break;
                grassCells.push(...clusterGrow(pick(free), Math.ceil(grassTarget / grassSeeds)));
            }
            grassCells.slice(0, grassTarget).forEach(k => {
                createOrUpdateCell(k, 'plot', { color: '#2ecc71', height: 0, vegetation: Math.random() < 0.6 });
            });

            // 建筑簇
            const buildCount = Math.min(26, Math.max(10, rand(12, 24)));
            const buildSeeds = Math.max(1, Math.min(4, Math.floor(buildCount / 8)));
            const buildCells = [];
            for (let s = 0; s < buildSeeds && buildCells.length < buildCount; s++) {
                const free = interior.filter(k => !used.has(k));
                if (!free.length) break;
                buildCells.push(...clusterGrow(pick(free), Math.ceil(buildCount / buildSeeds)));
            }
            buildCells.slice(0, buildCount).forEach(k => {
                createOrUpdateCell(k, 'building', {
                    height: rand(2, 14),
                    color: pick(CONFIG.colors),
                    shape: pick(shapes),
                    style: pick(styles),
                    rotation: pick(rots)
                });
            });

            // 3. 剩余内部格填充为草地，保证城市内无残留空隙
            interior.filter(k => !used.has(k)).forEach(k => {
                createOrUpdateCell(k, 'plot', { color: '#2ecc71', height: 0, vegetation: Math.random() < 0.5 });
            });

            updatePopulation();
            renderSelection();
            toast('🎲 已生成随机城市 (8×8)');
        };

        // 自动保存
        const autoSaveEl = document.getElementById('autosave-toggle');
        if (autoSaveEl) autoSaveEl.addEventListener('change', e => { autosaveOn = e.target.checked; });
        let autosaveOn = autoSaveEl ? autoSaveEl.checked : false;
        setInterval(() => { if (autosaveOn && state.mapData.size > 0) saveGame(true); }, CONFIG.autoSaveInterval);

        // --- 统计 ---
        window.openStats = () => {
            const modal = document.getElementById('stats-modal');
            if (!modal) return;
            let b = 0, p = 0, r = 0, n = 0;
            state.mapData.forEach(d => {
                if (d.type === 'building') b++;
                else if (d.type === 'plot') p++;
                else if (d.type === 'road') r++;
                if (d.nameData) n++;
            });
            const body = document.getElementById('stats-body');
            if (body) body.innerHTML = `
                <div class="stats-row"><span>🏢 楼宇数量</span><b>${b}</b></div>
                <div class="stats-row"><span>🟩 地块数量</span><b>${p}</b></div>
                <div class="stats-row"><span>🛣️ 道路数量</span><b>${r}</b></div>
                <div class="stats-row"><span>🏷️ 已命名</span><b>${n}</b></div>
                <div class="stats-row"><span>👥 当前人口</span><b>${state.population}</b></div>`;
            modal.classList.add('open');
        };

        // --- 人口 ---
        function updatePopulation() {
            let pop = 0;
            state.mapData.forEach(d => { if (d.type === 'building') pop += d.height * CONFIG.maxPedestrians / 100 * 5; });
            state.population = Math.floor(pop);
            updatePopDisplay();
            maintainPedestrians();
        }

        function updatePopDisplay() {
            document.getElementById('pop-display').innerText = `👥 ${state.population}`;
        }

        setInterval(() => {
            if (state.population > 0) {
                const factor = 1 + (Math.random() * 0.06 - 0.03);
                const displayVal = Math.floor(state.population * factor);
                document.getElementById('pop-display').innerText = `👥 ${displayVal}`;
            }
        }, 3000);

        // --- 路人系统：绕建筑慢走/进楼移除、草地慢走、人行道行走、斑马线过街、禁止水面 ---
        const PED_SPEED = 2.2;                    // 慢速（世界单位/秒）
        const PED_EDGE = CONFIG.gridSize / 2 - 0.65; // 人行道边缘偏移
        const WATER_COLOR = '#48dbfb';            // 水面预设色

        function isWaterCell(gx, gz) {
            const d = state.mapData.get(`${gx},${gz}`);
            return !!(d && d.type === 'plot' && d.color && d.color.toLowerCase() === WATER_COLOR);
        }
        function isRoadCell(gx, gz) {
            const d = state.mapData.get(`${gx},${gz}`);
            return !!d && d.type === 'road';
        }
        function isGrassCell(gx, gz) {
            const d = state.mapData.get(`${gx},${gz}`);
            return !!(d && d.type === 'plot' && d.color && d.color.toLowerCase() !== WATER_COLOR);
        }

        function killPedestrian(p) {
            pedestrianGroup.remove(p);
            const i = state.pedestrians.indexOf(p);
            if (i >= 0) state.pedestrians.splice(i, 1);
        }

        // 恒定数量：按人口比例维持，随机生成/移除
        function pedTarget() {
            return Math.min(Math.floor(state.population * CONFIG.pedestrianRatio), CONFIG.maxPedestrians);
        }
        function maintainPedestrians() {
            const target = pedTarget();
            while (state.pedestrians.length < target) createPedestrian();
            while (state.pedestrians.length > target) {
                const p = state.pedestrians.pop();
                pedestrianGroup.remove(p);
            }
        }

        // 选择合法出生格（禁止水面）
        function pickPedSpawnCell() {
            const keys = Array.from(state.mapData.keys());
            const ok = keys.filter(k => {
                const d = state.mapData.get(k);
                if (d.type === 'building') return false;
                if (d.type === 'plot' && d.color && d.color.toLowerCase() === WATER_COLOR) return false;
                return true;
            });
            return ok.length ? ok[Math.floor(Math.random() * ok.length)] : null;
        }

        // 附近建筑（半径 3.5 格）
        function nearestBuilding(gx, gz) {
            let best = null, bd = 3.5;
            state.mapData.forEach((d, k) => {
                if (d.type !== 'building') return;
                const [bx, bz] = k.split(',').map(Number);
                const dd = Math.hypot(bx - gx, bz - gz);
                if (dd < bd) { bd = dd; best = { x: bx, z: bz, key: k }; }
            });
            return best;
        }

        // 人行道/过街目标点
        function nextSidewalkPoint(gx, gz, pos) {
            const gs = CONFIG.gridSize;
            const edge = PED_EDGE;
            const hasN = isRoadCell(gx, gz - 1), hasS = isRoadCell(gx, gz + 1);
            const hasE = isRoadCell(gx + 1, gz), hasW = isRoadCell(gx - 1, gz);
            const vertical = hasN || hasS, horizontal = hasE || hasW;
            const inter = vertical && horizontal;
            const cx = gx * gs, cz = gz * gs;

            // 路口：走斑马线横穿过街
            if (inter) {
                const dirs = [];
                if (hasN) dirs.push(['n', cx + Math.max(-4, Math.min(4, pos.x - cx)), cz - gs / 2]);
                if (hasS) dirs.push(['s', cx + Math.max(-4, Math.min(4, pos.x - cx)), cz + gs / 2]);
                if (hasE) dirs.push(['e', cx + gs / 2, cz + Math.max(-4, Math.min(4, pos.z - cz))]);
                if (hasW) dirs.push(['w', cx - gs / 2, cz + Math.max(-4, Math.min(4, pos.z - cz))]);
                const d = dirs[Math.floor(Math.random() * dirs.length)];
                return new THREE.Vector3(d[1], 0.25, d[2]);
            }

            // 沿人行道走（道路两侧边缘）
            const cands = [];
            if (vertical) {
                const sideX = cx + (Math.abs(pos.x - (cx - edge)) < Math.abs(pos.x - (cx + edge)) ? -edge : edge);
                if (hasN) cands.push(new THREE.Vector3(sideX, 0.25, cz - edge));
                if (hasS) cands.push(new THREE.Vector3(sideX, 0.25, cz + edge));
            } else if (horizontal) {
                const sideZ = cz + (Math.abs(pos.z - (cz - edge)) < Math.abs(pos.z - (cz + edge)) ? -edge : edge);
                if (hasE) cands.push(new THREE.Vector3(cx + edge, 0.25, sideZ));
                if (hasW) cands.push(new THREE.Vector3(cx - edge, 0.25, sideZ));
            }
            if (!cands.length) cands.push(new THREE.Vector3(cx + (Math.random() - 0.5) * 6, 0.25, cz + (Math.random() - 0.5) * 6));
            return cands[Math.floor(Math.random() * cands.length)];
        }

        // 草地慢走目标点
        function nextGrassPoint(gx, gz) {
            const gs = CONFIG.gridSize;
            const pool = [`${gx},${gz}`, `${gx + 1},${gz}`, `${gx - 1},${gz}`, `${gx},${gz + 1}`, `${gx},${gz - 1}`];
            const grass = pool.filter(k => isGrassCell(...k.split(',').map(Number)));
            const k = grass.length ? grass[Math.floor(Math.random() * grass.length)] : `${gx},${gz}`;
            const [tx, tz] = k.split(',').map(Number);
            return new THREE.Vector3(tx * gs + (Math.random() - 0.5) * 7, 0.25, tz * gs + (Math.random() - 0.5) * 7);
        }

        // 绕建筑走动 / 走入建筑中心（进入后移除）
        function nextBuildingPoint(p) {
            const gs = CONFIG.gridSize;
            const u = p.userData;
            const gx = Math.round(p.position.x / gs), gz = Math.round(p.position.z / gs);
            const b = nearestBuilding(gx, gz);
            if (!b) {
                // 附近无建筑：向旁边格子慢走
                const [tx, tz] = `${gx + (Math.random() < 0.5 ? 1 : -1)},${gz}`.split(',').map(Number);
                return new THREE.Vector3(tx * gs + (Math.random() - 0.5) * 5, 0.25, tz * gs + (Math.random() - 0.5) * 5);
            }
            const cx = b.x * gs, cz = b.z * gs;
            const corners = [
                [cx - gs / 2 + 0.4, cz - gs / 2 + 0.4],
                [cx + gs / 2 - 0.4, cz - gs / 2 + 0.4],
                [cx + gs / 2 - 0.4, cz + gs / 2 - 0.4],
                [cx - gs / 2 + 0.4, cz + gs / 2 - 0.4]
            ];
            // 换目标建筑时重置周边行走状态
            if (u.bid !== b.key) {
                u.bid = b.key;
                u.perimCount = 0;
                u.enterChance = Math.random() < 0.35;
            }
            u.perimCount++;
            // 绕行数圈后有机会走入建筑中心（进入即移除）
            if (u.enterChance && u.perimCount >= 3 && Math.random() < 0.5) {
                return new THREE.Vector3(cx, 0.25, cz);
            }
            const c = corners[u.perimCount % 4];
            return new THREE.Vector3(c[0], 0.25, c[1]);
        }

        function computeNextWaypoint(p) {
            const gs = CONFIG.gridSize;
            const u = p.userData;
            const gx = Math.round(p.position.x / gs), gz = Math.round(p.position.z / gs);
            if (u.mode === 'road') u.wp = nextSidewalkPoint(gx, gz, p.position);
            else if (u.mode === 'grass') {
                // 草地慢走；若已走到道路则改为沿人行道行走
                const cell = state.mapData.get(`${gx},${gz}`);
                if (cell && cell.type === 'road') u.wp = nextSidewalkPoint(gx, gz, p.position);
                else u.wp = nextGrassPoint(gx, gz);
            }
            else u.wp = nextBuildingPoint(p);
        }

        // 路人每帧移动（目标点寻路 + 建筑绕行/进楼移除 + 水面防御）
        function stepPedestrian(p, dt) {
            const gs = CONFIG.gridSize;
            const u = p.userData;
            const pos = p.position;
            const gx = Math.round(pos.x / gs), gz = Math.round(pos.z / gs);

            u.life = (u.life || 0) + dt;
            if (u.life > 45) { killPedestrian(p); return; } // 存活上限，保证持续更新

            // 水面 → 立即移除
            if (isWaterCell(gx, gz)) { killPedestrian(p); return; }

            // 走进建筑中心 → 移除（进入建筑）
            const cell = state.mapData.get(`${gx},${gz}`);
            if (cell && cell.type === 'building') {
                const bx = gx * gs, bz = gz * gs;
                if (Math.hypot(pos.x - bx, pos.z - bz) < 1.6) { killPedestrian(p); return; }
            }

            const wp = u.wp;
            if (!wp || pos.distanceTo(wp) < 0.5) { computeNextWaypoint(p); return; }

            const dir = wp.clone().sub(pos);
            if (dir.length() < 0.01) { computeNextWaypoint(p); return; }
            dir.normalize();
            if (!u.dir) u.dir = dir.clone();
            u.dir.lerp(dir, 0.15).normalize();

            const step = u.speed * dt;
            const nx = pos.x + u.dir.x * step;
            const nz = pos.z + u.dir.z * step;
            const ngx = Math.round(nx / gs), ngz = Math.round(nz / gs);

            // 前方为建筑：仅在进入建筑实体范围（半宽约3.5）内时绕行，避免穿模；
            // 若正走向建筑中心（进入建筑）则允许通行，靠近中心后会被移除
            const ncell = state.mapData.get(`${ngx},${ngz}`);
            if (ncell && ncell.type === 'building') {
                const bcx = ngx * gs, bcz = ngz * gs;
                const distC = Math.hypot(nx - bcx, nz - bcz);
                const headingCenter = u.wp && Math.abs(u.wp.x - bcx) < 1.5 && Math.abs(u.wp.z - bcz) < 1.5;
                if (distC < 3.5 && !headingCenter) {
                    u.blocked = (u.blocked || 0) + 1;
                    if (u.blocked > 20) { killPedestrian(p); return; }
                    computeNextWaypoint(p);
                    return;
                }
            }

            pos.set(nx, 0.25, nz);
            u.blocked = 0;
        }

        function createPedestrian() {
            const key = pickPedSpawnCell();
            if (!key) return;
            const [x, z] = key.split(',').map(Number);
            const gs = CONFIG.gridSize;
            const cell = state.mapData.get(key);

            let sx, sz;
            if (cell.type === 'road') {
                // 出生在人行道上
                const hasN = isRoadCell(x, z - 1), hasS = isRoadCell(x, z + 1);
                const hasE = isRoadCell(x + 1, z), hasW = isRoadCell(x - 1, z);
                const vertical = hasN || hasS, horizontal = hasE || hasW;
                let lx, lz;
                if (vertical && !horizontal) { lx = (Math.random() < 0.5 ? -1 : 1) * PED_EDGE; lz = (Math.random() - 0.5) * 6; }
                else if (horizontal && !vertical) { lz = (Math.random() < 0.5 ? -1 : 1) * PED_EDGE; lx = (Math.random() - 0.5) * 6; }
                else { lx = (Math.random() < 0.5 ? -1 : 1) * PED_EDGE; lz = (Math.random() < 0.5 ? -1 : 1) * PED_EDGE; }
                sx = x * gs + lx; sz = z * gs + lz;
            } else {
                sx = x * gs + (Math.random() - 0.5) * 6;
                sz = z * gs + (Math.random() - 0.5) * 6;
            }

            const geo = new THREE.CircleGeometry(0.35, 12);
            const mat = new THREE.MeshBasicMaterial({
                color: CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)],
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(sx, 0.25, sz);

            // 行为模式：道路→人行道行走；草地→草地慢走；其余→绕建筑走动
            const mode = cell.type === 'road' ? 'road' : (Math.random() < 0.5 ? 'grass' : 'building');
            mesh.userData.mode = mode;
            mesh.userData.speed = PED_SPEED * (0.85 + Math.random() * 0.3);
            mesh.userData.wp = null;
            mesh.userData.life = 0;
            mesh.userData.bid = null;
            computeNextWaypoint(mesh);

            pedestrianGroup.add(mesh);
            state.pedestrians.push(mesh);
        }

        function clearPedestriansOnGrid(gx, gz) {
            for (let i = state.pedestrians.length - 1; i >= 0; i--) {
                const p = state.pedestrians[i];
                const pgx = Math.round(p.position.x / CONFIG.gridSize);
                const pgz = Math.round(p.position.z / CONFIG.gridSize);
                if (pgx === gx && pgz === gz) {
                    pedestrianGroup.remove(p);
                    state.pedestrians.splice(i, 1);
                }
            }
        }

        // --- 性能优化：建筑可见范围（以镜头为中心，远处建筑自动隐藏）---
        const clock = new THREE.Clock();
        let cullFrame = 0;
        let pedFrame = 0;

        window.setVisRange = (n) => {
            state.visRange = n;
            document.querySelectorAll('#visrange-selector .type-btn').forEach(b => b.classList.remove('selected'));
            const idx = [15, 20, 30, 50].indexOf(n);
            if (idx >= 0) document.querySelectorAll('#visrange-selector .type-btn')[idx].classList.add('selected');
        };

        function forEachMeshMaterial(obj, fn) {
            obj.traverse(o => {
                if (o.isMesh) {
                    const mats = Array.isArray(o.material) ? o.material : [o.material];
                    mats.forEach(fn);
                }
            });
        }

        function setBuildingOpacity(rec, op) {
            forEachMeshMaterial(rec.mesh, m => { m.transparent = true; m.opacity = op; });
        }

        // 监测建筑位置：以镜头（视角中心）为原点，超出可见范围的建筑隐藏（含过渡效果）
        function updateCulling() {
            const half = state.visRange / 2; // 半个边长（格）
            const camPos = controls.target;
            const cgx = camPos.x / CONFIG.gridSize;
            const cgz = camPos.z / CONFIG.gridSize;
            const culled = new Set();
            state.mapData.forEach((rec, key) => {
                if (rec.type !== 'building') return;
                const bgx = rec.mesh.position.x / CONFIG.gridSize;
                const bgz = rec.mesh.position.z / CONFIG.gridSize;
                const out = Math.abs(bgx - cgx) > half || Math.abs(bgz - cgz) > half;
                if (!rec.cull) rec.cull = { opacity: 1, target: 1 };
                rec.cull.target = out ? 0 : 1;
                // 需要淡入淡出的建筑加入处理集合
                if (out || rec.cull.opacity !== rec.cull.target) culled.add(rec);
            });
            state._culled = culled;
        }

        // 隐藏过渡：淡出淡入，避免建筑突然消失的突兀感，并同步隐藏标签
        function fadeCulling(dt) {
            if (!state._culled) return;
            const step = Math.min(1, 4 * (dt || 0.016));
            state._culled.forEach(rec => {
                const c = rec.cull;
                if (!c) return;
                // 已删除的建筑不再处理
                if (!state.mapData.has(rec.mesh.userData.gridKey)) return;
                if (c.opacity === c.target) {
                    if (c.target === 0 && !c.hidden) {
                        c.hidden = true;
                        rec.mesh.visible = false;
                        if (rec.mesh.userData.labelObj) rec.mesh.userData.labelObj.visible = false;
                        forEachMeshMaterial(rec.mesh, m => { m.transparent = false; m.opacity = 1; });
                    }
                    return;
                }
                // 淡出/淡入：保证网格可见以便过渡，标签同步（隐藏时同步隐藏，避免悬浮标签）
                if (!rec.mesh.visible) rec.mesh.visible = true;
                if (rec.mesh.userData.labelObj) rec.mesh.userData.labelObj.visible = (c.target === 1);
                c.opacity += (c.target - c.opacity) * step;
                if (Math.abs(c.opacity - c.target) < 0.02) c.opacity = c.target;
                setBuildingOpacity(rec, c.opacity);
                if (c.opacity === c.target) {
                    c.hidden = c.target === 0;
                    if (c.target === 0) {
                        rec.mesh.visible = false;
                        forEachMeshMaterial(rec.mesh, m => { m.transparent = false; m.opacity = 1; });
                    } else {
                        // 淡入完成：恢复不透明渲染
                        forEachMeshMaterial(rec.mesh, m => { if (m.transparent) m.transparent = false; });
                    }
                }
            });
        }

        // --- 循环 ---
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            controls.update();

            // 性能：以镜头为中心的可见范围监测，远处建筑淡出隐藏（含过渡效果）
            if (++cullFrame % 30 === 0) updateCulling();
            fadeCulling(dt);

            if (state.visibility.pedestrians) {
                // 路人寻路行走（绕建筑/草地/人行道/过街/进楼移除/水面防御）
                for (let i = state.pedestrians.length - 1; i >= 0; i--) {
                    stepPedestrian(state.pedestrians[i], dt);
                }
                // 周期性维持恒定数量（随机生成或移除）
                if (++pedFrame % 90 === 0) maintainPedestrians();
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // 初始应用光照角度
        applyLightAngle(45);
        animate();

    </script>
</body>

</html>
