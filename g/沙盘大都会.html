<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>沙盘大都会</title>
    <style>
        /* --- 全局样式 --- */
        :root {
            --bg-color: #ffffff;
            --ui-bg: #ffffff;
            --ui-border: 1px solid #e0e0e0;
            --primary: #48dbfb;
            --primary-hover: #0abde3;
            --accent: #ff9f43;
            --text: #2d3436;
            --radius: 20px;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            user-select: none;
        }

        /* --- UI 容器 --- */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 顶部栏 (无圆角，无投影) */
        .top-bar {
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--ui-bg);
            border-bottom: var(--ui-border);
            margin: 0;
        }

        .title-area h1 {
            margin: 0;
            font-size: 22px;
            color: #2d3436;
            letter-spacing: 1px;
        }

        .icon-btn {
            background: #f1f2f6;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: #dfe4ea;
            transform: rotate(90deg);
        }

        /* 左下角人口 (无投影) */
        .stats-panel {
            pointer-events: auto;
            position: absolute;
            top: 90px;
            left: 30px;
            background: var(--ui-bg);
            padding: 8px 12px 8px 20px;
            border-radius: 50px;
            font-weight: 800;
            color: #1dd1a1;
            border: var(--ui-border);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-btn {
            background: #f1f2f6;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 15px;
        }

        .stats-btn:hover {
            background: #dfe4ea;
        }

        /* 模式切换 (无投影) */
        .mode-switcher {
            pointer-events: auto;
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ui-bg);
            padding: 5px;
            border-radius: 50px;
            display: flex;
            border: var(--ui-border);
        }

        .mode-btn {
            border: none;
            background: transparent;
            padding: 8px 24px;
            cursor: pointer;
            font-weight: bold;
            color: #b2bec3;
            font-size: 14px;
            border-radius: 50px;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
        }

        /* 可视化面板 (右侧, 无投影) */
        .visibility-panel {
            pointer-events: auto;
            position: absolute;
            top: 90px;
            right: 30px;
            background: var(--ui-bg);
            padding: 15px;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: var(--ui-border);
        }

        .vis-toggle {
            display: flex;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            color: #636e72;
            font-weight: 600;
        }

        .vis-toggle input {
            margin-right: 8px;
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        /* 底部工具栏 (无投影) */
        .bottom-bar {
            pointer-events: auto;
            padding: 20px 30px 25px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .action-btn {
            background: var(--ui-bg);
            border: 1px solid #eee;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            color: var(--primary);
            border-color: var(--primary);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.move-active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Toast 提示 */
        #toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-70px);
            background: rgba(45, 52, 54, 0.92);
            color: #fff;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            pointer-events: none;
            z-index: 4000;
            transition: transform 0.25s;
            white-space: nowrap;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* --- 弹窗 --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 2000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #fff;
            padding: 25px;
            border-radius: 24px;
            width: 380px;
            max-width: 92%;
            border: 1px solid #eee;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin: 0 0 20px 0;
            color: #2d3436;
            font-size: 20px;
            text-align: center;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #636e72;
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .shape-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 5px;
        }

        .type-btn {
            background: #f1f2f6;
            padding: 10px 5px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #636e72;
            border: 2px solid transparent;
            transition: 0.1s;
        }

        .type-btn:hover {
            background: #dfe4ea;
        }

        .type-btn.selected {
            border-color: var(--primary);
            background: #e0f9ff;
            color: var(--primary-hover);
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin-top: 5px;
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .color-swatch.selected {
            border-color: #333;
            transform: scale(1.1);
        }

        .btn-full {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
            border-radius: 16px;
            font-weight: 700;
        }

        .btn-full:hover {
            background: var(--primary-hover);
        }

        .btn-full.secondary {
            background: #f1f2f6;
            color: #636e72;
        }

        /* 悬停 Tooltip */
        #hover-tooltip {
            position: absolute;
            background: rgba(45, 52, 54, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 3000;
            white-space: nowrap;
            font-weight: 600;
            line-height: 1.5;
            text-align: left;
        }

        .coord-text {
            font-size: 11px;
            color: #bdc3c7;
            font-weight: 400;
            margin-top: 2px;
        }

        /* 命名标签 */
        .label-container {
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #dfe6e9;
            pointer-events: none;
            white-space: nowrap;
            color: #2d3436;
        }

        /* 统计面板行 */
        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }

        .stats-row:last-child {
            border-bottom: none;
        }

        .stats-row span {
            color: #636e72;
            font-weight: 600;
        }

        .stats-row b {
            color: #2d3436;
        }

        @media (max-width: 600px) {
            .bottom-bar {
                flex-direction: column;
                padding: 15px;
                width: 100%;
                box-sizing: border-box;
            }

            .action-btn {
                width: 100%;
                justify-content: center;
            }

            .visibility-panel {
                display: none;
            }

            .stats-panel {
                top: auto;
                bottom: 250px;
                left: 15px;
            }
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>
    <div id="hover-tooltip"></div>
    <div id="toast"></div>

    <div id="game-ui">
        <div class="top-bar">
            <div class="title-area">
                <h1>🏙️ 沙盘大都会</h1>
            </div>
            <div>
                <button class="icon-btn" onclick="openSettings()" title="设置">⚙️</button>
            </div>
        </div>

        <div class="mode-switcher">
            <button class="mode-btn active" onclick="setMode('edit', this)">🛠️ 编辑</button>
            <button class="mode-btn" onclick="setMode('view', this)">👀 观赏</button>
        </div>

        <div class="stats-panel">
            <span id="pop-display">👥 0</span>
            <button class="stats-btn" onclick="openStats()" title="城市统计">📊</button>
        </div>

        <div class="visibility-panel">
            <label class="vis-toggle"><input type="checkbox" checked onchange="toggleVis('labels', this.checked)">
                命名标签</label>
            <label class="vis-toggle"><input type="checkbox" checked onchange="toggleVis('shadows', this.checked)">
                阴影</label>
            <label class="vis-toggle"><input type="checkbox" checked onchange="toggleVis('pedestrians', this.checked)">
                路人</label>
            <label class="vis-toggle"><input type="checkbox" onchange="toggleVis('hoverInfo', this.checked)">
                悬停信息</label>
        </div>

        <div class="bottom-bar" id="edit-tools" style="display: none;">
            <button class="action-btn" onclick="openBuildModal()">🏗️ 建造 / 修改</button>
            <button class="action-btn" onclick="openNameModal()">🏷️ 命名</button>
            <button class="action-btn" id="btn-move" onclick="toggleMoveMode()">✥ 移动</button>
            <button class="action-btn" onclick="rotateSelected()">⟳ 旋转</button>
            <button class="action-btn" onclick="deleteSelected()">🧹 拆除</button>
            <button class="action-btn" onclick="undo()">↩️ 撤销</button>
            <button class="action-btn" onclick="redo()">↪️ 重做</button>
        </div>
    </div>

    <!-- 建造弹窗 -->
    <div class="modal-overlay" id="build-modal">
        <div class="modal">
            <h2>建造配置</h2>
            <div class="form-group">
                <label>类型</label>
                <div class="type-grid">
                    <div class="type-btn selected" id="type-building" onclick="selectBuildType('building')">楼宇</div>
                    <div class="type-btn" id="type-plot" onclick="selectBuildType('plot')">地块</div>
                    <div class="type-btn" id="type-road" onclick="selectBuildType('road')">道路</div>
                </div>
            </div>

            <!-- 楼宇 -->
            <div id="settings-building">
                <div class="form-group">
                    <label>形状</label>
                    <div class="shape-grid" id="shape-selector">
                        <div class="type-btn selected" onclick="selectShape('square')">正方</div>
                        <div class="type-btn" onclick="selectShape('diamond')">菱形</div>
                        <div class="type-btn" onclick="selectShape('hexagon')">六边</div>
                        <div class="type-btn" onclick="selectShape('rectH')">横长</div>
                        <div class="type-btn" onclick="selectShape('rectV')">竖长</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>样式</label>
                    <div class="type-grid" id="style-selector">
                        <div class="type-btn selected" onclick="selectStyle('office')">写字楼</div>
                        <div class="type-btn" onclick="selectStyle('residential')">住宅</div>
                        <div class="type-btn" onclick="selectStyle('industrial')">工业</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>朝向 (固定旋转角度) : <span id="rot-val" style="color:var(--primary)">0°</span></label>
                    <div class="type-grid" style="grid-template-columns: repeat(4, 1fr);" id="rot-selector">
                        <div class="type-btn selected" onclick="selectRot(0)">0°</div>
                        <div class="type-btn" onclick="selectRot(45)">45°</div>
                        <div class="type-btn" onclick="selectRot(90)">90°</div>
                        <div class="type-btn" onclick="selectRot(135)">135°</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>高度 (1-50层) : <span id="h-val" style="color:var(--primary)">5</span></label>
                    <input type="range" min="1" max="50" value="5" id="building-height"
                        style="width:100%; accent-color:var(--primary);"
                        oninput="document.getElementById('h-val').innerText=this.value">
                </div>
                <div class="form-group">
                    <label>颜色</label>
                    <div class="color-grid" id="building-colors"></div>
                    <input type="color" id="custom-building-color"
                        style="width:100%; margin-top:8px; height:30px; border:none; padding:0; border-radius:8px;">
                </div>
            </div>

            <!-- 地块 -->
            <div id="settings-plot" style="display:none;">
                <div class="form-group">
                    <label>预设</label>
                    <div class="type-grid">
                        <div class="type-btn" onclick="setPlotPreset('#bdc3c7', false)">水泥</div>
                        <div class="type-btn" onclick="setPlotPreset('#2ecc71', true)">草地</div>
                        <div class="type-btn" onclick="setPlotPreset('#48dbfb', false)">水面</div>
                    </div>
                    <input type="color" id="custom-plot-color" value="#2ecc71"
                        style="width:100%; margin-top:8px; height:30px; border:none; padding:0; border-radius:8px;">
                    <label class="vis-toggle" style="margin-top:10px;"><input type="checkbox" id="plot-veg" checked>
                        种植树木</label>
                </div>
            </div>

            <!-- 道路 -->
            <div id="settings-road" style="display:none;">
                <p style="font-size:13px; color:#636e72; background:#f1f2f6; padding:10px; border-radius:10px;">
                    铺设道路将自动清理该区域的路人，并自动连接相邻路段。</p>
            </div>

            <button class="btn-full" onclick="confirmBuild()">完成</button>
            <button class="btn-full secondary" onclick="closeModals()">取消</button>
        </div>
    </div>

    <!-- 命名弹窗 -->
    <div class="modal-overlay" id="name-modal">
        <div class="modal">
            <h2>区域命名</h2>
            <div class="form-group">
                <div class="type-grid" style="grid-template-columns: repeat(4, 1fr);" id="name-types">
                    <div class="type-btn" onclick="selectNameType(this, 'res', '🏠', '#ff9f43', '住宅')">住宅</div>
                    <div class="type-btn" onclick="selectNameType(this, 'off', '🏢', '#54a0ff', '办公')">办公</div>
                    <div class="type-btn" onclick="selectNameType(this, 'com', '🛍️', '#feca57', '商业')">商业</div>
                    <div class="type-btn" onclick="selectNameType(this, 'ind', '🏭', '#8395a7', '工业')">工业</div>
                    <div class="type-btn" onclick="selectNameType(this, 'park', '🌳', '#1dd1a1', '公园')">公园</div>
                    <div class="type-btn" onclick="selectNameType(this, 'pub', '🏛️', '#5f27cd', '公共')">公共</div>
                    <div class="type-btn" onclick="selectNameType(this, 'fun', '🎡', '#ff6b6b', '娱乐')">娱乐</div>
                    <div class="type-btn" onclick="selectNameType(this, 'farm', '🌾', '#ff9ff3', '农业')">农业</div>
                </div>
            </div>
            <input type="text" id="area-name-input" placeholder="输入名称..."
                style="width: 100%; padding: 12px; border:1px solid #dfe6e9; border-radius:12px; box-sizing: border-box; font-size:14px; outline:none;">
            <button class="btn-full" onclick="confirmName()">确定</button>
            <button class="btn-full secondary" onclick="closeModals()">取消</button>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>游戏设置</h2>

            <div class="form-group">
                <label>地面颜色 (接收阴影)</label>
                <div class="type-grid">
                    <div class="type-btn" onclick="setGroundColor('#ffffff')">白色</div>
                    <div class="type-btn" onclick="setGroundColor('#2ecc71')">草地</div>
                    <div class="type-btn" onclick="setGroundColor('#bdc3c7')">水泥</div>
                </div>
                <input type="color" id="custom-ground-color" oninput="setGroundColor(this.value)" value="#ffffff"
                    style="width:100%; margin-top:8px; height:30px; border:none; border-radius:8px;">
            </div>

            <div class="form-group">
                <label>背景颜色</label>
                <input type="color" id="custom-bg-color" oninput="setBgColor(this.value)" value="#ffffff"
                    style="width:100%; height:30px; border:none; border-radius:8px;">
            </div>

            <div class="form-group">
                <label>光照方向</label>
                <input type="range" min="0" max="360" value="45" id="light-slider" style="width:100%; accent-color:var(--primary);"
                    oninput="applyLightAngle(parseFloat(this.value))">
            </div>

            <div class="form-group">
                <label>存档管理</label>
                <div class="type-grid">
                    <div class="type-btn" onclick="saveGame(false)">💾 保存</div>
                    <div class="type-btn" onclick="loadGame()">📂 载入</div>
                    <div class="type-btn" onclick="clearMap()">🗑️ 清空</div>
                </div>
                <label class="vis-toggle" style="margin-top:10px;"><input type="checkbox" id="autosave-toggle" checked>
                    自动保存 (每30秒)</label>
            </div>

            <div class="form-group">
                <label>建筑可见范围 (以镜头为中心，远处建筑自动隐藏)</label>
                <div class="type-grid" id="visrange-selector">
                    <div class="type-btn selected" onclick="setVisRange(15)">15×15</div>
                    <div class="type-btn" onclick="setVisRange(20)">20×20</div>
                    <div class="type-btn" onclick="setVisRange(30)">30×30</div>
                    <div class="type-btn" onclick="setVisRange(50)">50×50</div>
                </div>
            </div>

            <div class="form-group">
                <label>调试工具</label>
                <div class="type-grid">
                    <div class="type-btn" onclick="randomCity()">🎲 随机城市</div>
                </div>
            </div>

            <button class="btn-full" onclick="closeModals()">关闭</button>
        </div>
    </div>

    <!-- 统计弹窗 -->
    <div class="modal-overlay" id="stats-modal">
        <div class="modal" style="width: 320px;">
            <h2>📊 城市统计</h2>
            <div id="stats-body"></div>
            <button class="btn-full" style="margin-top:16px;" onclick="closeModals()">关闭</button>
        </div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { MapControls } from 'three/addons/controls/MapControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const CONFIG = {
            gridSize: 10,
            colors: [
                "#ff9ff3", "#feca57", "#ff6b6b", "#48dbfb", "#1dd1a1", "#54a0ff",
                "#5f27cd", "#c8d6e5", "#576574", "#8395a7", "#222f3e", "#00d2d3",
                "#ff9f43", "#ee5253", "#0abde3", "#10ac84"
            ],
            roadColor: "#576574",
            defaultGround: "#ffffff",
            defaultBg: "#ffffff",
            pedestrianRatio: 0.1,   // 路人占人口比例 (可配置)
            maxPedestrians: 986,    // 路人数量上限 (可配置)
            saveKey: "sandy-metropolis-save-v1",
            autoSaveInterval: 30000 // 自动保存间隔
        };

        // 建筑外立面样式
        const BUILDING_STYLES = {
            office:      { label: '写字楼',   metalness: 0.2, roughness: 0.45 },
            residential: { label: '住宅',     metalness: 0.1, roughness: 0.7 },
            industrial:  { label: '工业',     metalness: 0.4, roughness: 0.6 }
        };

        const state = {
            mode: 'edit',
            subMode: 'normal',
            selection: new Set(),
            mapData: new Map(),
            hoverKey: null,
            isCtrlPressed: false,
            currentBuildType: 'building',
            currentShape: 'square',
            currentStyle: 'office',
            currentRotation: 0,
            currentNameType: { type: 'res', emoji: '🏠', color: '#ff9f43', typeLabel: '住宅' },
            visibility: { labels: true, shadows: true, pedestrians: true, hoverInfo: false },
            visRange: 15, // 建筑可见范围（格），默认 15×15，超出范围的远处建筑自动隐藏
            population: 0,
            pedestrians: [],
            hoverTimer: null
        };

        // 撤销/重做历史
        const history = { stack: [], index: -1, MAX: 60 };

        // --- 颜色工具 ---
        function shade(hex, f) {
            const n = parseInt(hex.replace('#', ''), 16);
            let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
            r = Math.min(255, Math.round(r * f));
            g = Math.min(255, Math.round(g * f));
            b = Math.min(255, Math.round(b * f));
            return `rgb(${r},${g},${b})`;
        }

        // --- Init ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.defaultBg);
        scene.fog = new THREE.Fog(CONFIG.defaultBg, 120, 600);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(60, 80, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false; // 已废除 ShadowMap，改用软投影阴影
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.getElementById('canvas-container').appendChild(labelRenderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x666666, 0.45);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 150, 100);
        scene.add(dirLight);

        // --- 地面系统 (Z-Fighting 修复) ---
        // 1. 颜色层 - Y = -0.6 (MeshBasicMaterial 精确显示所选颜色)
        let currentGround = CONFIG.defaultGround;
        let currentBg = CONFIG.defaultBg;
        let lightAngle = 45;

        const groundColorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(10000, 10000),
            new THREE.MeshBasicMaterial({ color: currentGround })
        );
        groundColorMesh.rotation.x = -Math.PI / 2;
        groundColorMesh.position.y = -0.6;
        scene.add(groundColorMesh);

        // 2. 新阴影系统：软投影(blob) —— 稳定无闪烁，替代 ShadowMap
        const shadowGroup = new THREE.Group();
        scene.add(shadowGroup);

        // 软阴影纹理（径向渐变）
        function makeShadowTexture() {
            const W = 128, H = 128;
            const cv = document.createElement('canvas');
            cv.width = W; cv.height = H;
            const ctx = cv.getContext('2d');
            const g = ctx.createRadialGradient(W / 2, H / 2, 4, W / 2, H / 2, W / 2);
            g.addColorStop(0, 'rgba(0,0,0,0.42)');
            g.addColorStop(0.55, 'rgba(0,0,0,0.24)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            return new THREE.CanvasTexture(cv);
        }
        const shadowTex = makeShadowTexture();

        // 创建软投影：baseX/baseZ 为建筑所在格中心的世界坐标
        function createBlobShadow(baseX, baseZ, height) {
            const blob = new THREE.Mesh(
                new THREE.CircleGeometry(1, 16),
                new THREE.MeshBasicMaterial({
                    map: shadowTex, transparent: true, depthWrite: false,
                    polygonOffset: true, polygonOffsetFactor: -1
                })
            );
            blob.rotation.x = -Math.PI / 2;
            const s = 2.2 + (height || 0) * 0.45;
            blob.scale.set(s, s, s);
            blob.userData.baseX = baseX;
            blob.userData.baseZ = baseZ;
            blob.userData.shadowHeight = height || 0;
            blob.position.y = 0.02;
            applyBlobOffset(blob);
            shadowGroup.add(blob);
            return blob;
        }

        function applyBlobOffset(blob) {
            const rad = lightAngle * Math.PI / 180;
            const dx = Math.sin(rad), dz = Math.cos(rad);
            const len = 1 + (blob.userData.shadowHeight || 0) * 0.22;
            blob.position.x = blob.userData.baseX - dx * len;
            blob.position.z = blob.userData.baseZ - dz * len;
        }

        // --- 辅助物体 ---
        const highlightMesh = new THREE.Mesh(
            new THREE.BoxGeometry(CONFIG.gridSize + 0.6, 0.6, CONFIG.gridSize + 0.6),
            new THREE.MeshBasicMaterial({ color: 0x48dbfb, opacity: 0.4, transparent: true, depthTest: false })
        );
        highlightMesh.visible = false;
        scene.add(highlightMesh);

        const selectionGroup = new THREE.Group();
        scene.add(selectionGroup);
        const pedestrianGroup = new THREE.Group();
        scene.add(pedestrianGroup);

        const controls = new MapControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.ROTATE };

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        // 交互隐形板
        const infPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(10000, 10000),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        infPlane.rotation.x = -Math.PI / 2;
        scene.add(infPlane);

        // --- 交互逻辑 ---
        let isDragging = false;
        let mouseDownTime = 0;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Control') state.isCtrlPressed = true;
            // 输入框聚焦时不拦截撤销/重做快捷键
            const tag = e.target && e.target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
            if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') ||
                ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'z')) { e.preventDefault(); redo(); }
        });
        document.addEventListener('keyup', e => { if (e.key === 'Control') state.isCtrlPressed = false; });

        const canvasEl = renderer.domElement;
        canvasEl.addEventListener('pointerdown', () => { isDragging = false; mouseDownTime = Date.now(); });
        canvasEl.addEventListener('pointermove', onPointerMove);
        canvasEl.addEventListener('pointerup', onPointerUp);
        canvasEl.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

        function onPointerMove(e) {
            isDragging = true;
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            if (state.mode === 'edit') updateHighlight();
            if (state.visibility.hoverInfo) checkHoverInfo(e.clientX, e.clientY);
        }

        function onPointerUp() {
            if (Date.now() - mouseDownTime < 250 && !isDragging && state.mode === 'edit') handleClick();
        }

        function getIntersect() {
            raycaster.setFromCamera(pointer, camera);
            const objects = Array.from(state.mapData.values()).map(d => d.mesh).filter(m => m);
            const hits = raycaster.intersectObjects(objects, true);
            if (hits.length > 0) return { type: 'obj', object: hits[0].object };

            const gHits = raycaster.intersectObject(infPlane);
            if (gHits.length > 0) {
                const p = gHits[0].point;
                const x = Math.round(p.x / CONFIG.gridSize);
                const z = Math.round(p.z / CONFIG.gridSize);
                return { type: 'ground', x, z, key: `${x},${z}` };
            }
            return null;
        }

        function updateHighlight() {
            const hit = getIntersect();
            if (hit) {
                let x, z;
                if (hit.type === 'obj') {
                    const key = hit.object.userData.gridKey;
                    if (key) { [x, z] = key.split(',').map(Number); state.hoverKey = key; }
                } else {
                    x = hit.x; z = hit.z; state.hoverKey = hit.key;
                }
                if (x !== undefined) {
                    highlightMesh.position.set(x * CONFIG.gridSize, 0.3, z * CONFIG.gridSize);
                    highlightMesh.visible = true;
                    highlightMesh.material.color.setHex(state.subMode === 'moving' ? 0xff6b6b : 0x48dbfb);
                }
            } else {
                highlightMesh.visible = false;
                state.hoverKey = null;
            }
        }

        function handleClick() {
            if (!state.hoverKey) return;
            const key = state.hoverKey;
            if (state.subMode === 'moving') { executeMove(key); return; }

            if (state.isCtrlPressed) {
                if (state.selection.has(key)) state.selection.delete(key);
                else state.selection.add(key);
            } else {
                state.selection.clear();
                state.selection.add(key);
            }
            renderSelection();
        }

        function renderSelection() {
            while (selectionGroup.children.length > 0) {
                const c = selectionGroup.children[0];
                selectionGroup.remove(c);
                if (c.geometry) c.geometry.dispose();
                if (c.material) c.material.dispose();
            }
            state.selection.forEach(key => {
                const [x, z] = key.split(',').map(Number);
                const box = new THREE.Mesh(
                    new THREE.BoxGeometry(CONFIG.gridSize + 0.8, 0.5, CONFIG.gridSize + 0.8),
                    new THREE.MeshBasicMaterial({ color: 0xfeca57, opacity: 0.6, transparent: true, depthTest: false })
                );
                box.position.set(x * CONFIG.gridSize, 0.1, z * CONFIG.gridSize);
                selectionGroup.add(box);
            });
            document.getElementById('edit-tools').style.display = state.selection.size > 0 ? 'flex' : 'none';
        }

        // --- 悬停信息 ---
        const tooltipEl = document.getElementById('hover-tooltip');
        let lastHoverObj = null;

        function checkHoverInfo(clientX, clientY) {
            raycaster.setFromCamera(pointer, camera);
            const objects = Array.from(state.mapData.values()).map(d => d.mesh).filter(m => m);
            const hits = raycaster.intersectObjects(objects, true);

            if (hits.length > 0) {
                const obj = hits[0].object;
                if (obj !== lastHoverObj) {
                    lastHoverObj = obj;
                    clearTimeout(state.hoverTimer);
                    tooltipEl.style.display = 'none';
                    state.hoverTimer = setTimeout(() => {
                        const data = state.mapData.get(obj.userData.gridKey);
                        if (data && data.nameData) {
                            // 第一行: 类别 (typeLabel) + 名称
                            let text = `${data.nameData.typeLabel || '建筑'} ${data.nameData.text}`;
                            // 第二行: 坐标
                            const [gx, gz] = obj.userData.gridKey.split(',');
                            const coordHtml = `<div class="coord-text">坐标: (${gx}, ${gz})</div>`;

                            tooltipEl.innerHTML = `<div>${text}</div>${coordHtml}`;
                            tooltipEl.style.left = (clientX + 15) + 'px';
                            tooltipEl.style.top = (clientY + 15) + 'px';
                            tooltipEl.style.display = 'block';
                        }
                    }, 500);
                } else if (tooltipEl.style.display === 'block') {
                    tooltipEl.style.left = (clientX + 15) + 'px';
                    tooltipEl.style.top = (clientY + 15) + 'px';
                }
            } else {
                if (lastHoverObj) {
                    lastHoverObj = null;
                    clearTimeout(state.hoverTimer);
                    tooltipEl.style.display = 'none';
                }
            }
        }

        // --- 建造 ---
        const colorContainer = document.getElementById('building-colors');
        CONFIG.colors.forEach(color => {
            const div = document.createElement('div');
            div.className = 'color-swatch';
            div.style.backgroundColor = color;
            div.onclick = () => {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                div.classList.add('selected');
                document.getElementById('custom-building-color').value = color;
            };
            colorContainer.appendChild(div);
        });

        window.setMode = (mode, el) => {
            state.mode = mode;
            state.subMode = 'normal';
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            if (mode === 'view') {
                state.selection.clear();
                renderSelection();
                highlightMesh.visible = false;
            }
        };

        window.toggleVis = (type, isActive) => {
            state.visibility[type] = isActive;
            if (type === 'labels') labelRenderer.domElement.style.display = isActive ? 'block' : 'none';
            if (type === 'shadows') shadowGroup.visible = isActive;
            if (type === 'pedestrians') pedestrianGroup.visible = isActive;
        };

        // --- 楼宇外观生成 ---
        // widthWorld: 该纹理所覆盖的立面实际宽度（世界单位），不同面宽自动生成对应窗格数量，实现自然贴合
        function createBuildingTexture(style, baseColor, floors, widthWorld) {
            const W = 512, H = 512;
            const cv = document.createElement('canvas');
            cv.width = W; cv.height = H;
            const ctx = cv.getContext('2d');

            const cols = Math.max(1, Math.round(widthWorld / 1.6));
            const rows = Math.max(1, floors);
            const cw = W / cols, ch = H / rows;

            // 立面纵向渐变
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, shade(baseColor, 1.18));
            g.addColorStop(0.5, shade(baseColor, 1.0));
            g.addColorStop(1, shade(baseColor, 0.75));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);

            const isOffice = style === 'office';
            const isRes = style === 'residential';
            const isInd = style === 'industrial';
            const isGlass = style === 'glass'; // 旧存档兼容

            if (isOffice) {
                // 写字楼：通高玻璃幕墙 + 深色楼层横梁 + 竖挺，冷色调为主
                for (let r = 0; r < rows; r++) {
                    const y = r * ch;
                    ctx.fillStyle = 'rgba(0,0,0,0.20)';
                    ctx.fillRect(0, y, W, Math.max(2, ch * 0.09));
                    for (let c = 0; c < cols; c++) {
                        const x = c * cw;
                        const lit = Math.random() < 0.3;
                        ctx.fillStyle = lit
                            ? 'rgba(255,244,205,0.95)'
                            : `rgba(${90 + (Math.random() * 50 | 0)},${150 + (Math.random() * 60 | 0)},235,0.9)`;
                        ctx.fillRect(x + cw * 0.07, y + ch * 0.13, cw * 0.86, ch * 0.74);
                    }
                }
                // 竖挺 + 顶部反光
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 1;
                for (let c = 0; c <= cols; c++) { ctx.beginPath(); ctx.moveTo(c * cw, 0); ctx.lineTo(c * cw, H); ctx.stroke(); }
                const rg = ctx.createLinearGradient(0, 0, W, 0);
                rg.addColorStop(0, 'rgba(255,255,255,0)');
                rg.addColorStop(0.5, 'rgba(255,255,255,0.18)');
                rg.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = rg;
                ctx.fillRect(0, 0, W, H);
            } else if (isRes) {
                // 住宅：暖色小窗 + 窗框 + 阳台/楼板线，亮灯密集、尺度更细
                for (let r = 0; r < rows; r++) {
                    const y = r * ch;
                    // 楼板 / 阳台线
                    ctx.fillStyle = 'rgba(0,0,0,0.10)';
                    ctx.fillRect(0, y + ch * 0.86, W, Math.max(2, ch * 0.10));
                    ctx.fillStyle = 'rgba(255,255,255,0.10)';
                    ctx.fillRect(0, y + ch * 0.84, W, Math.max(1, ch * 0.03));
                    for (let c = 0; c < cols; c++) {
                        const x = c * cw;
                        const lit = Math.random() < 0.55;
                        const winC = lit
                            ? (Math.random() < 0.5 ? 'rgba(255,236,170,0.98)' : 'rgba(255,250,230,0.98)')
                            : 'rgba(150,175,200,0.9)';
                        const ix = x + cw * 0.18, iy = y + ch * 0.16;
                        const iw = cw * 0.64, ih = ch * 0.6;
                        // 窗框
                        ctx.fillStyle = 'rgba(45,52,54,0.35)';
                        ctx.fillRect(ix - 1, iy - 1, iw + 2, ih + 2);
                        ctx.fillStyle = winC;
                        ctx.fillRect(ix, iy, iw, ih);
                        // 中梃
                        ctx.fillStyle = 'rgba(45,52,54,0.5)';
                        ctx.fillRect(ix + iw / 2 - 1, iy, 2, ih);
                    }
                }
            } else if (isInd) {
                // 工业：波纹横带 + 实墙 + 小窗
                for (let r = 0; r < rows; r++) {
                    const y = r * ch;
                    ctx.fillStyle = 'rgba(0,0,0,0.10)';
                    ctx.fillRect(0, y, W, Math.max(2, ch * 0.14));
                    for (let c = 0; c < cols; c++) {
                        if (Math.random() < 0.4) continue; // 部分实墙
                        const x = c * cw;
                        const lit = Math.random() < 0.2;
                        ctx.fillStyle = lit ? 'rgba(255,235,180,0.9)' : 'rgba(120,140,160,0.9)';
                        ctx.fillRect(x + cw * 0.25, y + ch * 0.2, cw * 0.5, ch * 0.6);
                    }
                }
            } else {
                // 玻璃(旧存档兼容)：竖挺网格
                for (let r = 0; r < rows; r++) {
                    const y = r * ch;
                    for (let c = 0; c < cols; c++) {
                        const x = c * cw;
                        const lit = Math.random() < 0.12;
                        ctx.fillStyle = lit
                            ? 'rgba(255,240,205,0.92)'
                            : `rgba(${150 + (Math.random() * 60 | 0)},${190 + (Math.random() * 40 | 0)},255,0.85)`;
                        ctx.fillRect(x + cw * 0.1, y + ch * 0.1, cw * 0.8, ch * 0.8);
                    }
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.28)';
                ctx.lineWidth = 1;
                for (let r = 0; r <= rows; r++) { ctx.beginPath(); ctx.moveTo(0, r * ch); ctx.lineTo(W, r * ch); ctx.stroke(); }
                for (let c = 0; c <= cols; c++) { ctx.beginPath(); ctx.moveTo(c * cw, 0); ctx.lineTo(c * cw, H); ctx.stroke(); }
            }

            // 顶部边缘高光
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(0, 0, W, 2);

            const tex = new THREE.CanvasTexture(cv);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 4;
            return tex;
        }

        function buildBuildingMesh(key, params) {
            const [x, z] = key.split(',').map(Number);
            const h = params.height * 3;
            const floors = params.height;
            const style = params.style || 'office';
            const shape = params.shape || 'square';
            const group = new THREE.Group();

            // 旧存档可能含 glass 样式，回退到玻璃参数避免崩溃
            const styleDef = BUILDING_STYLES[style] || { label: '现代玻璃', metalness: 0.7, roughness: 0.2 };

            // 各面面宽（世界单位），纹理按实际面宽生成窗格，避免呆板拉伸
            const s = CONFIG.gridSize - 1.5;
            let wide = s, narrow = s;
            if (shape === 'diamond') { wide = narrow = s * 0.75; }
            else if (shape === 'rectH') { wide = s; narrow = s * 0.5; }
            else if (shape === 'rectV') { wide = s; narrow = s * 0.5; }

            const makeSideMat = (faceW) => {
                const tex = createBuildingTexture(style, params.color, floors, faceW);
                return new THREE.MeshStandardMaterial({
                    map: tex, metalness: styleDef.metalness, roughness: styleDef.roughness
                });
            };
            const wideMat = makeSideMat(wide);
            const narrowMat = makeSideMat(narrow);
            const topMat = new THREE.MeshStandardMaterial({ color: shade(params.color, 0.72), roughness: 0.9, metalness: 0.05 });
            const bottomMat = new THREE.MeshStandardMaterial({ color: shade(params.color, 0.6), roughness: 0.9 });

            let main;
            if (shape === 'hexagon') {
                // 六边形：侧壁纹理按周长贴合，绕一圈自然过渡
                const r = s / 2;
                const hexMat = makeSideMat(6 * r);
                main = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 6), [hexMat, topMat, bottomMat]);
            } else if (shape === 'rectH') {
                main = new THREE.Mesh(new THREE.BoxGeometry(wide, h, narrow),
                    [wideMat, wideMat, topMat, bottomMat, narrowMat, narrowMat]);
            } else if (shape === 'rectV') {
                main = new THREE.Mesh(new THREE.BoxGeometry(narrow, h, wide),
                    [narrowMat, narrowMat, topMat, bottomMat, wideMat, wideMat]);
            } else {
                // 正方形 / 菱形共用同面宽
                main = new THREE.Mesh(new THREE.BoxGeometry(wide, h, wide),
                    [wideMat, wideMat, topMat, bottomMat, wideMat, wideMat]);
            }
            main.position.y = h / 2;
            main.castShadow = true;
            main.receiveShadow = true;
            group.add(main);

            // --- 智能顶楼楼板：按基础形状自动适配几何形态 ---
            const slabTh = 0.25;
            const slabMat = new THREE.MeshStandardMaterial({ color: shade(params.color, 0.75), roughness: 0.8 });
            let slab;
            if (shape === 'hexagon') {
                const r = s / 2;
                slab = new THREE.Mesh(new THREE.CylinderGeometry(r, r, slabTh, 6), slabMat);
            } else if (shape === 'rectH') {
                slab = new THREE.Mesh(new THREE.BoxGeometry(wide + 0.1, slabTh, narrow + 0.1), slabMat);
            } else if (shape === 'rectV') {
                slab = new THREE.Mesh(new THREE.BoxGeometry(narrow + 0.1, slabTh, wide + 0.1), slabMat);
            } else {
                // 正方形 / 菱形：方形楼板随整体旋转，菱形即呈菱形外观
                slab = new THREE.Mesh(new THREE.BoxGeometry(wide * 1.02, slabTh, wide * 1.02), slabMat);
            }
            slab.position.y = h + 0.12;
            slab.castShadow = true;
            slab.receiveShadow = true;
            group.add(slab);

            // 高层楼顶设备
            if (h >= 15) {
                const eqCount = 1 + Math.floor(Math.random() * 2);
                const rr = wide / 2 - 1.2;
                for (let i = 0; i < eqCount; i++) {
                    const eq = new THREE.Mesh(
                        new THREE.BoxGeometry(0.8 + Math.random(), 0.8 + Math.random() * 0.6, 0.8 + Math.random()),
                        new THREE.MeshStandardMaterial({ color: shade(params.color, 0.55), roughness: 0.9 })
                    );
                    eq.position.set((Math.random() - 0.5) * rr * 1.5, h + 0.55, (Math.random() - 0.5) * rr * 1.5);
                    eq.castShadow = true;
                    group.add(eq);
                }
            }

            if (params.rotation) group.rotation.y = params.rotation * Math.PI / 180;
            group.position.set(x * CONFIG.gridSize, 0, z * CONFIG.gridSize);
            return group;
        }

        // --- 树木 ---
        function createTree() {
            const g = new THREE.Group();
            const trunkH = 0.6;
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.07, 0.11, trunkH, 5),
                new THREE.MeshStandardMaterial({ color: '#7d5a33', roughness: 1 })
            );
            trunk.position.y = trunkH / 2;
            const greens = ['#2ecc71', '#1dd1a1', '#27ae60', '#6ab04c'];
            const canopy = new THREE.Mesh(
                new THREE.IcosahedronGeometry(0.5, 0),
                new THREE.MeshStandardMaterial({ color: greens[Math.random() * greens.length | 0], roughness: 0.9 })
            );
            canopy.position.y = trunkH + 0.42;
            canopy.scale.set(1, 1.15, 1);
            canopy.castShadow = true;
            g.add(trunk, canopy);
            return g;
        }

        function buildPlotMesh(key, params) {
            const [x, z] = key.split(',').map(Number);
            const group = new THREE.Group();
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(CONFIG.gridSize, 0.2, CONFIG.gridSize),
                new THREE.MeshStandardMaterial({ color: params.color, roughness: 0.9 })
            );
            box.position.y = 0.1;
            box.receiveShadow = true;
            group.add(box);

            if (params.vegetation) {
                const trees = 2 + Math.floor(Math.random() * 3);
                const half = CONFIG.gridSize / 2 - 1.2;
                for (let i = 0; i < trees; i++) {
                    const t = createTree();
                    t.position.set((Math.random() - 0.5) * half * 1.6, 0.2, (Math.random() - 0.5) * half * 1.6);
                    group.add(t);
                }
            }
            group.position.set(x * CONFIG.gridSize, 0, z * CONFIG.gridSize);
            return group;
        }

        function buildRoadMesh(key, params) {
            const [x, z] = key.split(',').map(Number);
            const gs = CONFIG.gridSize;
            const group = new THREE.Group();

            // 相邻格判定（基于 mapData，需在建格后再刷新邻居道路）
            const isRoad = (gx, gz) => { const d = state.mapData.get(`${gx},${gz}`); return !!d && d.type === 'road'; };

            const hasN = isRoad(x, z - 1), hasS = isRoad(x, z + 1);
            const hasE = isRoad(x + 1, z), hasW = isRoad(x - 1, z);
            const vertical = hasN || hasS;
            const horizontal = hasE || hasW;
            const isIntersection = vertical && horizontal;

            // 1. 沥青路面
            const asphalt = new THREE.Mesh(
                new THREE.BoxGeometry(gs, 0.15, gs),
                new THREE.MeshStandardMaterial({ color: params.color, roughness: 0.95 })
            );
            asphalt.position.y = 0.08;
            asphalt.receiveShadow = true;
            group.add(asphalt);

            // 2. 灰色人行道：仅在道路交叉路口隐藏；道路连接处保持连贯显示
            const swW = 1.3, swH = 0.18, swMat = new THREE.MeshStandardMaterial({ color: 0xbdc3c7, roughness: 0.9 });
            const edgeL = gs / 2 - swW / 2;
            const addSidewalk = (px, pz, lx, lz) => {
                const sw = new THREE.Mesh(new THREE.BoxGeometry(lx, swH, lz), swMat);
                sw.position.set(px, 0.12, pz);
                sw.receiveShadow = true;
                group.add(sw);
            };
            if (!isIntersection) {
                if (vertical && !horizontal) {
                    // 垂直路段：东西两侧人行道沿道路连贯
                    addSidewalk(edgeL, 0, swW, gs);
                    addSidewalk(-edgeL, 0, swW, gs);
                } else if (horizontal && !vertical) {
                    // 水平路段：南北两侧人行道沿道路连贯
                    addSidewalk(0, -edgeL, gs, swW);
                    addSidewalk(0, edgeL, gs, swW);
                } else {
                    // 孤立道路：四周铺设人行道
                    addSidewalk(0, -edgeL, gs, swW);
                    addSidewalk(0, edgeL, gs, swW);
                    addSidewalk(edgeL, 0, swW, gs);
                    addSidewalk(-edgeL, 0, swW, gs);
                }
            }

            // 3. 车道分隔虚线（路口统一隐藏，避免与斑马线重合闪烁）
            const dashMat = new THREE.MeshBasicMaterial({ color: 0xf5f6fa });
            if (!isIntersection) {
                const isVerticalRun = vertical || (!vertical && !horizontal);
                const half = gs / 2 - 0.6;
                const segLen = 2.4;
                const dashGeo = isVerticalRun
                    ? new THREE.BoxGeometry(0.32, 0.02, segLen)
                    : new THREE.BoxGeometry(segLen, 0.02, 0.32);
                const count = Math.max(1, Math.floor(gs / 5));
                for (let i = 0; i < count; i++) {
                    const offset = -half + (i + 0.5) * ((2 * half) / count);
                    const dash = new THREE.Mesh(dashGeo, dashMat);
                    dash.position.set(isVerticalRun ? 0 : offset, 0.2, isVerticalRun ? offset : 0);
                    group.add(dash);
                }
            }

            // 4. 路口斑马线（仅在道路交叉边缘，横向跨越整条道路）
            if (isIntersection) {
                const zebraMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const zebraT = 1.0, stripeW = 0.55, stripeGap = 1.1;
                const stripes = Math.max(1, Math.floor(gs / stripeGap));
                const start = -gs / 2 + (gs - stripes * stripeGap) / 2 + stripeW / 2;
                const addZebra = (dir) => {
                    for (let i = 0; i < stripes; i++) {
                        const off = start + i * stripeGap;
                        const st = (dir === 'n' || dir === 's')
                            ? new THREE.Mesh(new THREE.BoxGeometry(stripeW, 0.03, zebraT), zebraMat)
                            : new THREE.Mesh(new THREE.BoxGeometry(zebraT, 0.03, stripeW), zebraMat);
                        if (dir === 'n') st.position.set(off, 0.2, -gs / 2);
                        else if (dir === 's') st.position.set(off, 0.2, gs / 2);
                        else if (dir === 'e') st.position.set(gs / 2, 0.2, off);
                        else st.position.set(-gs / 2, 0.2, off);
                        group.add(st);
                    }
                };
                if (hasN) addZebra('n');
                if (hasS) addZebra('s');
                if (hasE) addZebra('e');
                if (hasW) addZebra('w');
            }

            group.position.set(x * gs, 0, z * gs);
            return group;
        }

        // --- 网格数据管理 (稳定性核心) ---
        function setUserData(obj, data) {
            obj.traverse(o => { o.userData = { ...o.userData, ...data }; });
        }

        function removeLabelFromObject(obj) {
            if (obj.userData && obj.userData.labelObj) {
                const l = obj.userData.labelObj;
                if (l.element && l.element.parentNode) l.element.parentNode.removeChild(l.element);
                obj.remove(l);
                obj.userData.labelObj = null;
            }
        }

        function removeCellNoRefresh(key) {
            const d = state.mapData.get(key);
            if (!d) return;
            const obj = d.mesh;
            // 释放软投影阴影
            if (d.shadowBlob) {
                shadowGroup.remove(d.shadowBlob);
                d.shadowBlob.geometry.dispose();
                d.shadowBlob.material.dispose();
                d.shadowBlob = null;
            }
            removeLabelFromObject(obj);
            scene.remove(obj);
            obj.traverse(o => {
                if (o.isMesh) {
                    if (o.geometry) o.geometry.dispose();
                    const mats = Array.isArray(o.material) ? o.material : [o.material];
                    mats.forEach(m => {
                        if (m.map) m.map.dispose();
                        m.dispose();
                    });
                }
            });
            state.mapData.delete(key);
        }

        function removeCell(key) {
            removeCellNoRefresh(key);
            refreshRoadsAround(key);
        }

        // 刷新指定格及其四邻中的道路（人行道/虚线/斑马线随相邻变化自适应）
        function refreshRoadsAround(key) {
            if (!key) return;
            const [x, z] = key.split(',').map(Number);
            [[x, z], [x - 1, z], [x + 1, z], [x, z - 1], [x, z + 1]].forEach(([gx, gz]) => {
                const k = `${gx},${gz}`;
                const d = state.mapData.get(k);
                if (d && d.type === 'road') {
                    createOrUpdateCellNoRefresh(k, 'road', {
                        color: d.color, height: d.height,
                        nameData: d.nameData ? { ...d.nameData } : null
                    });
                }
            });
        }

        function clearAllCells() {
            const keys = Array.from(state.mapData.keys());
            state.mapData.clear();
            keys.forEach(k => removeCellNoRefresh(k));
        }

        function createOrUpdateCellNoRefresh(key, type, params) {
            const old = state.mapData.get(key);
            if (old && old.nameData && !params.nameData) params.nameData = old.nameData;
            removeCellNoRefresh(key);

            const [x, z] = key.split(',').map(Number);
            // 仅支持固定旋转角度（0/45/90/135），旧存档角度吸附修正
            if (type === 'building' && params.rotation) params.rotation = snapRot(params.rotation);
            let mesh;
            if (type === 'building') mesh = buildBuildingMesh(key, params);
            else if (type === 'plot') {
                mesh = buildPlotMesh(key, params);
                // 水面禁止路人出现：放置/改色为水面时清除该格路人
                if (params.color && params.color.toLowerCase() === WATER_COLOR) clearPedestriansOnGrid(x, z);
            }
            else if (type === 'road') { mesh = buildRoadMesh(key, params); clearPedestriansOnGrid(x, z); }

            setUserData(mesh, { gridKey: key, type, ...params });
            if (params.nameData) attachLabel(mesh, params.nameData);
            scene.add(mesh);
            const record = { type, mesh, ...params };
            state.mapData.set(key, record);

            // 建筑：生成软投影阴影（与视角光照角度联动，稳定无闪烁）
            if (type === 'building') {
                record.shadowBlob = createBlobShadow(x * CONFIG.gridSize, z * CONFIG.gridSize, params.height || 1);
                mesh.userData.shadowBlob = record.shadowBlob;
            }
            return record;
        }

        function createOrUpdateCell(key, type, params) {
            createOrUpdateCellNoRefresh(key, type, params);
            refreshRoadsAround(key);
        }

        // --- 建造弹窗逻辑 ---
        window.openBuildModal = () => {
            const modal = document.getElementById('build-modal');
            if (!modal) return;
            const firstKey = state.selection.values().next().value;
            const data = state.mapData.get(firstKey);
            if (data) {
                selectBuildType(data.type);
                if (data.type === 'building') {
                    document.getElementById('building-height').value = data.height;
                    document.getElementById('h-val').innerText = data.height;
                    document.getElementById('custom-building-color').value = data.color;
                    selectShape(data.shape || 'square');
                    selectStyle(data.style || 'office');
                    setRotInput(data.rotation || 0);
                } else if (data.type === 'plot') {
                    document.getElementById('custom-plot-color').value = data.color;
                    document.getElementById('plot-veg').checked = !!data.vegetation;
                }
            } else {
                selectBuildType('building');
                document.getElementById('building-height').value = 5;
                document.getElementById('h-val').innerText = 5;
                selectShape('square');
                selectStyle('office');
                setRotInput(0);
            }
            modal.classList.add('open');
        };

        window.closeModals = () => document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));

        window.selectBuildType = (type) => {
            state.currentBuildType = type;
            document.querySelectorAll('#build-modal .type-btn').forEach(b => b.classList.remove('selected'));
            const btn = document.getElementById('type-' + type);
            if (btn) btn.classList.add('selected');
            ['building', 'plot', 'road'].forEach(t => {
                const el = document.getElementById('settings-' + t);
                if (el) el.style.display = (t === type ? 'block' : 'none');
            });
        };

        const FIXED_ROTS = [0, 45, 90, 135];

        // 吸附到最近的固定角度（考虑 360° 环形距离）
        function snapRot(v) {
            let best = FIXED_ROTS[0], bd = Infinity;
            FIXED_ROTS.forEach(a => {
                const d = Math.min(Math.abs(v - a), 360 - Math.abs(v - a));
                if (d < bd) { bd = d; best = a; }
            });
            return best;
        }

        function setRotInput(v) {
            v = snapRot(v);
            state.currentRotation = v;
            document.getElementById('rot-val').innerText = v + '°';
            document.querySelectorAll('#rot-selector .type-btn').forEach(b => b.classList.remove('selected'));
            const idx = FIXED_ROTS.indexOf(v);
            if (idx >= 0) document.querySelectorAll('#rot-selector .type-btn')[idx].classList.add('selected');
        }

        window.selectRot = (deg) => {
            state.currentRotation = deg;
            document.getElementById('rot-val').innerText = deg + '°';
            document.querySelectorAll('#rot-selector .type-btn').forEach(b => b.classList.remove('selected'));
            const idx = FIXED_ROTS.indexOf(deg);
            if (idx >= 0) document.querySelectorAll('#rot-selector .type-btn')[idx].classList.add('selected');
        };

        window.selectShape = (shape) => {
            state.currentShape = shape;
            document.querySelectorAll('#shape-selector .type-btn').forEach(b => b.classList.remove('selected'));
            const index = ['square', 'diamond', 'hexagon', 'rectH', 'rectV'].indexOf(shape);
            if (index >= 0) document.querySelectorAll('#shape-selector .type-btn')[index].classList.add('selected');
            // 菱形默认旋转45° 以获得菱形外观
            if (shape === 'diamond' && state.currentRotation === 0) setRotInput(45);
        };

        window.selectStyle = (style) => {
            state.currentStyle = style;
            document.querySelectorAll('#style-selector .type-btn').forEach(b => b.classList.remove('selected'));
            const keys = Object.keys(BUILDING_STYLES);
            const idx = keys.indexOf(style);
            if (idx >= 0) document.querySelectorAll('#style-selector .type-btn')[idx].classList.add('selected');
        };

        window.setPlotPreset = (c, veg) => {
            const colorEl = document.getElementById('custom-plot-color');
            if (colorEl) colorEl.value = c;
            const vegEl = document.getElementById('plot-veg');
            if (vegEl) vegEl.checked = !!veg;
        };

        window.confirmBuild = () => {
            if (state.selection.size === 0) return alert("请先选择格子");
            const type = state.currentBuildType;
            const params = {};
            if (type === 'building') {
                params.height = parseInt(document.getElementById('building-height').value);
                params.color = document.getElementById('custom-building-color').value;
                params.shape = state.currentShape;
                params.style = state.currentStyle;
                params.rotation = state.currentRotation;
            } else if (type === 'plot') {
                params.color = document.getElementById('custom-plot-color').value;
                params.height = 0;
                params.vegetation = document.getElementById('plot-veg').checked;
            } else if (type === 'road') {
                params.color = CONFIG.roadColor;
                params.height = 0;
            }

            pushHistory();
            state.selection.forEach(key => createOrUpdateCell(key, type, params));
            closeModals();
            updatePopulation();
        };

        // --- 命名 ---
        window.openNameModal = () => {
            const modal = document.getElementById('name-modal');
            if (!modal) return;
            if (state.selection.size !== 1) return alert("请选择一个格子进行命名");
            const data = state.mapData.get(Array.from(state.selection)[0]);
            const input = document.getElementById('area-name-input');
            if (input) input.value = (data && data.nameData) ? data.nameData.text : "";
            modal.classList.add('open');
        };

        window.selectNameType = (el, type, emoji, color, typeLabel) => {
            state.currentNameType = { type, emoji, color, typeLabel };
            document.querySelectorAll('#name-types .type-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        };

        window.confirmName = () => {
            const text = document.getElementById('area-name-input').value;
            if (text) {
                const key = Array.from(state.selection)[0];
                const data = state.mapData.get(key);
                if (data) {
                    pushHistory();
                    const nameData = { text, ...state.currentNameType };
                    data.nameData = nameData;
                    attachLabel(data.mesh, nameData);
                }
            }
            closeModals();
        };

        function attachLabel(mesh, nameData) {
            removeLabelFromObject(mesh);

            const div = document.createElement('div');
            div.className = 'label-container';
            div.style.color = nameData.color;
            div.innerHTML = `<span>${nameData.emoji}</span><span>${nameData.text}</span>`;

            const label = new CSS2DObject(div);
            let y = 1.5;
            // 标签显示在建筑顶部（N 层 → 顶部高度 N*3，向上留出偏移）
            if (mesh.userData.type === 'building') y = (mesh.userData.height * 3) + 1.2;
            label.position.set(0, y, 0);

            mesh.add(label);
            mesh.userData.labelObj = label;
            mesh.userData.nameData = nameData;

            div.style.display = state.visibility.labels ? 'flex' : 'none';
        }

        // --- 移动 (稳定性修复: 彻底移除旧格 & 命名) ---
        window.toggleMoveMode = () => {
            const btn = document.getElementById('btn-move');
            if (state.subMode === 'moving') {
                state.subMode = 'normal'; btn.classList.remove('move-active');
            } else {
                if (state.selection.size === 0) return alert("请先选择格子");
                state.subMode = 'moving'; btn.classList.add('move-active');
            }
        };

        function executeMove(targetKey) {
            const keys = Array.from(state.selection);
            if (keys.length === 0) return;
            const [tx, tz] = targetKey.split(',').map(Number);
            const [ax, az] = keys[0].split(',').map(Number);
            const dx = tx - ax, dz = tz - az;

            const moves = [];
            const newKeysSet = new Set();
            for (let k of keys) {
                const [kx, kz] = k.split(',').map(Number);
                const nk = `${kx + dx},${kz + dz}`;
                newKeysSet.add(nk);
                const d = state.mapData.get(k);
                if (d) moves.push({
                    oldKey: k, newKey: nk,
                    params: {
                        type: d.type, height: d.height, color: d.color, shape: d.shape,
                        style: d.style, rotation: d.rotation || 0, vegetation: !!d.vegetation,
                        nameData: d.nameData ? { ...d.nameData } : null
                    }
                });
            }

            // 碰撞检测: 目标不可被占用 (除非目标也是选区的一部分)
            for (let nk of newKeysSet) {
                if (state.mapData.has(nk) && !state.selection.has(nk)) {
                    alert("无法移动：目标区域已有建筑！");
                    toggleMoveMode();
                    return;
                }
            }

            pushHistory();
            moves.forEach(m => removeCell(m.oldKey));
            moves.forEach(m => createOrUpdateCell(m.newKey, m.params.type, m.params));

            state.selection.clear();
            moves.forEach(m => state.selection.add(m.newKey));
            toggleMoveMode();
            renderSelection();
            updatePopulation();
        }

        // --- 旋转 & 拆除 ---
        window.rotateSelected = () => {
            if (state.selection.size === 0) return alert("请先选择格子");
            pushHistory();
            state.selection.forEach(k => {
                const d = state.mapData.get(k);
                if (!d || d.type !== 'building') return;
                // 仅按固定角度旋转：0° → 45° → 90° → 135° → 0°
                const rot = ((snapRot(d.rotation || 0)) + 45) % 180;
                d.rotation = rot;
                d.mesh.rotation.y = rot * Math.PI / 180;
            });
        };

        window.deleteSelected = () => {
            if (state.selection.size === 0) return alert("请先选择格子");
            if (!confirm(`确定拆除选中的 ${state.selection.size} 个格子吗？`)) return;
            pushHistory();
            state.selection.forEach(k => removeCell(k));
            state.selection.clear();
            renderSelection();
            updatePopulation();
        };

        // --- 撤销 / 重做 ---
        function snapshot() {
            return {
                map: Array.from(state.mapData).map(([k, d]) => ({
                    key: k, type: d.type, height: d.height, color: d.color,
                    shape: d.shape, style: d.style, rotation: d.rotation || 0,
                    vegetation: !!d.vegetation,
                    nameData: d.nameData ? { ...d.nameData } : null
                })),
                ground: currentGround,
                bg: currentBg,
                lightAngle
            };
        }

        function pushHistory() {
            history.stack = history.stack.slice(0, history.index + 1);
            history.stack.push(snapshot());
            if (history.stack.length > history.MAX) history.stack.shift();
            history.index = history.stack.length - 1;
        }

        function clearPedestrians() {
            state.pedestrians.forEach(p => pedestrianGroup.remove(p));
            state.pedestrians = [];
        }

        function applySnapshot(snap) {
            clearAllCells();
            clearPedestrians();
            (snap.map || []).forEach(rec => {
                const params = {
                    type: rec.type, height: rec.height, color: rec.color, shape: rec.shape,
                    style: rec.style, rotation: rec.rotation || 0, vegetation: rec.vegetation,
                    nameData: rec.nameData ? { ...rec.nameData } : null
                };
                createOrUpdateCell(rec.key, rec.type, params);
            });
            if (snap.ground) setGroundColor(snap.ground);
            if (snap.bg) setBgColor(snap.bg);
            if (typeof snap.lightAngle === 'number') applyLightAngle(snap.lightAngle);
            updatePopulation();
        }

        window.undo = () => {
            if (history.index <= 0) return;
            history.index--;
            applySnapshot(history.stack[history.index]);
        };

        window.redo = () => {
            if (history.index >= history.stack.length - 1) return;
            history.index++;
            applySnapshot(history.stack[history.index]);
        };

        // --- 设置 ---
        window.openSettings = () => {
            const m = document.getElementById('settings-modal');
            if (m) m.classList.add('open');
        };

        window.setGroundColor = (c) => {
            currentGround = c;
            const el = document.getElementById('custom-ground-color');
            if (el) el.value = c;
            groundColorMesh.material.color.set(c);
        };

        window.setBgColor = (c) => {
            currentBg = c;
            scene.background = new THREE.Color(c);
            scene.fog.color = new THREE.Color(c);
            const el = document.getElementById('custom-bg-color');
            if (el) el.value = c;
        };

        window.applyLightAngle = (deg) => {
            lightAngle = deg;
            const rad = deg * Math.PI / 180;
            const r = 150;
            dirLight.position.x = Math.sin(rad) * r;
            dirLight.position.z = Math.cos(rad) * r;
            const s = document.getElementById('light-slider');
            if (s) s.value = deg;
            // 软投影随光照方向联动
            shadowGroup.children.forEach(b => applyBlobOffset(b));
        };

        // --- 存档 ---
        function toast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove('show'), 1800);
        }

        window.saveGame = (silent) => {
            try {
                localStorage.setItem(CONFIG.saveKey, JSON.stringify({ version: 1, ...snapshot() }));
                if (!silent) toast('💾 已保存');
            } catch (e) {
                toast('保存失败：存储空间不足');
            }
        };

        window.loadGame = () => {
            const raw = localStorage.getItem(CONFIG.saveKey);
            if (!raw) return toast('没有找到存档');
            try {
                const d = JSON.parse(raw);
                pushHistory();
                applySnapshot(d);
                toast('📂 已载入存档');
            } catch (e) {
                toast('存档读取失败');
            }
        };

        window.clearMap = () => {
            if (!confirm('确定清空整个城市吗？此操作将删除所有建筑、地块、道路与命名，且无法撤销。')) return;
            pushHistory();
            clearAllCells();
            clearPedestrians();
            updatePopulation();
            renderSelection();
            toast('🗑️ 已清空全部内容');
        };

        // --- 随机城市 (调试) ---
        window.randomCity = () => {
            if (!confirm('确定生成随机城市吗？将先完全清空当前画布，再在 8×8 范围内生成新城市。')) return;
            pushHistory();
            // 先完全清空当前画布（含建筑/地块/道路/命名/阴影/路人），确保无残留
            clearAllCells();
            clearPedestrians();

            const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];
            const shapes = ['square', 'diamond', 'hexagon', 'rectH', 'rectV'];
            const styles = Object.keys(BUILDING_STYLES);
            const rots = [0, 45, 90, 135];

            // 严格 8×8 边界（含边缘），城市范围不超出设定边界
            const half = 4, x0 = -half, x1 = half - 1, z0 = -half, z1 = half - 1;
            const cells = [];
            for (let gx = x0; gx <= x1; gx++)
                for (let gz = z0; gz <= z1; gz++) cells.push(`${gx},${gz}`);
            const isBorder = k => {
                const [gx, gz] = k.split(',').map(Number);
                return gx === x0 || gx === x1 || gz === z0 || gz === z1;
            };
            const occupied = new Set();

            // 1. 环城道路（8×8 边缘一圈）
            cells.forEach(k => {
                if (isBorder(k)) {
                    createOrUpdateCell(k, 'road', { color: CONFIG.roadColor, height: 0 });
                    occupied.add(k);
                }
            });

            const interior = cells.filter(k => !isBorder(k));
            // 洗牌
            for (let i = interior.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [interior[i], interior[j]] = [interior[j], interior[i]];
            }
            const used = new Set();

            // 2. 聚居分布：由种子格向外生长成簇，同类元素聚集
            const clusterGrow = (seedKey, maxCount) => {
                const queue = [seedKey];
                const picked = [];
                let count = 0;
                while (queue.length && count < maxCount) {
                    const k = queue.shift();
                    if (used.has(k) || occupied.has(k)) continue;
                    used.add(k); occupied.add(k);
                    picked.push(k); count++;
                    const [gx, gz] = k.split(',').map(Number);
                    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
                    for (let d = dirs.length - 1; d > 0; d--) {
                        const j = Math.floor(Math.random() * (d + 1));
                        [dirs[d], dirs[j]] = [dirs[j], dirs[d]];
                    }
                    for (const [dx, dz] of dirs) {
                        const nk = `${gx + dx},${gz + dz}`;
                        if (used.has(nk) || occupied.has(nk)) continue;
                        if (Math.random() < 0.7) queue.push(nk); // 70% 延续簇，形成聚居
                    }
                }
                return picked;
            };

            // 草地簇
